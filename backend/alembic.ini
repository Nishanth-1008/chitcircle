# Alembic configuration for ChitCircle.
#
# Migrations are the only way schema changes reach a deployed database (gap #1). Startup never
# mutates schema; it calls db.assert_migrations_applied() and refuses to boot if the database is
# behind. SQLite (tests, local bootstrap) is exempt and created by db.init_db().

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# template used to name new revision files
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
