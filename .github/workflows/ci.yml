name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: chitcircle
          POSTGRES_PASSWORD: chitcircle
          POSTGRES_DB: chitcircle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chitcircle -d chitcircle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://chitcircle:chitcircle@localhost:5432/chitcircle
      WEBHOOK_SECRET: test-secret
      JWT_SECRET_KEY: test-jwt-secret-do-not-use-in-production
      APP_ENV: test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Run test suite
        run: pytest
        working-directory: backend
